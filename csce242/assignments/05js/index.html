<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Assignment 7 - Introduction to JavaScript</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main id="content">
            <h1>Assignment 7</h1>
            <h2>Introduction to JavaScript</h2>
            <div id="columns">
                <section id="speech" class="box">
                    <h3>Cloud Strife Wants To Say</h3>
                    <div id="speech-bubble"></div>
                </section>
                <section id="weapons" class="box">
                    <h3>Cloud's Weapons</h3>
                    <label for="weapon-select">Choose Cloud's weapon:</label>
                    <select id="weapon-select">
                        <option value="buster">Buster Sword</option>
                        <option value="sleek">Sleek Saber</option>
                        <option value="rune">Rune Blade</option>
                        <option value="crystal">Crystal Sword</option>
                        <option value="igneous">Igneous Saber</option>
                        <option value="slipstream">Slipstream Saber</option>
                        <option value="umbral">Umbral Blade</option>
                    </select>
                    <p id="weapon-message"></p>
                </section>
                <section id="sticker" class="box">
                    <h3>Add a Sticker</h3>
                    <div id="sticker-area">
                        <img src="images/materia.png" alt="Materia" id="materia-image">
                    </div>
                </section>
            </div>
            <footer>
                <p>Muhammad Johnson</p>
            </footer>
        </main>
        <script src="scripts/assignment.js"></script>
    </body>
</html>
